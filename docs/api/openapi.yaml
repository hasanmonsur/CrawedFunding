openapi: 3.1.0
info:
  title: CrowdFund360 API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is alive
  /ready:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Foundation dependencies are ready or intentionally stubbed
  /api/v1/platform/context:
    get:
      summary: Platform context and safety boundaries
      responses:
        "200":
          description: Product boundaries and role catalogue
  /api/v1/access-control/roles:
    get:
      summary: Role permission catalogue
      responses:
        "200":
          description: Role to permission mapping
  /api/v1/me:
    get:
      summary: Current authenticated user and assignments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current principal
        "401":
          description: Bearer token missing or invalid
  /api/v1/projects/scope-check:
    get:
      summary: Protected project scope authorization probe
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Principal can access scoped project
        "403":
          description: Scope or permission denied
  /api/v1/investors/me:
    get:
      summary: Current investor profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Investor profile with KYC, documents, bank accounts, nominees, and consents
    patch:
      summary: Update current investor profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated profile
  /api/v1/investors/documents:
    post:
      summary: Upload investor document metadata
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Document recorded
  /api/v1/investors/bank-accounts:
    post:
      summary: Add investor bank account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bank account recorded with masked response
  /api/v1/investors/nominees:
    post:
      summary: Add nominee or beneficiary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nominee recorded
  /api/v1/investors/consents:
    post:
      summary: Record investor consent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consent recorded
  /api/v1/investors/kyc/submit:
    post:
      summary: Submit current investor KYC case
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC submitted
        "409":
          description: Required evidence is incomplete
  /api/v1/kyc-cases/queue:
    get:
      summary: Compliance KYC review queue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC queue
  /api/v1/kyc-cases/investor:
    get:
      summary: Compliance investor profile view
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Investor profile for review
  /api/v1/kyc-cases/start-review:
    post:
      summary: Start compliance KYC review
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC case under review
  /api/v1/kyc-cases/request-information:
    post:
      summary: Request additional investor information
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Information required
  /api/v1/kyc-cases/approve:
    post:
      summary: Approve KYC case
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC approved
        "409":
          description: Duplicate or unresolved review blocker
  /api/v1/kyc-cases/reject:
    post:
      summary: Reject KYC case
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC rejected
  /api/v1/investors/holds:
    post:
      summary: Place compliance hold on investor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hold placed
  /api/v1/investors/duplicates:
    get:
      summary: Detect duplicate investor signals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Duplicate signals
  /api/v1/marketplace/projects:
    get:
      summary: Public marketplace list of published projects
      responses:
        "200":
          description: Published projects with current offer versions
  /api/v1/marketplace/offers:
    get:
      summary: Published offer disclosure
      responses:
        "200":
          description: Offer snapshot and required disclosures
        "404":
          description: Published offer not found
  /api/v1/marketplace/watchlist:
    post:
      summary: Add published project offer to investor watchlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Watchlist item recorded
  /api/v1/investments/suitability:
    post:
      summary: Record suitability answers and risk acknowledgement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Suitability recorded
        "409":
          description: Risk acknowledgement missing
  /api/v1/investments/commitments:
    post:
      summary: Reserve an investment commitment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commitment reserved
        "403":
          description: Investor is not eligible
        "409":
          description: Suitability missing or amount outside limits
  /api/v1/investments/agreements/accept:
    post:
      summary: Accept agreement for a reserved commitment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commitment moved to awaiting payment
  /api/v1/investments/portfolio:
    get:
      summary: Investor commitment portfolio
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current investor commitments
  /api/v1/payments/instructions:
    post:
      summary: Create idempotent payment instruction/reference for awaiting-payment commitment
      security:
        - bearerAuth: []
      parameters:
        - name: idempotency-key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment instruction issued
        "400":
          description: Missing idempotency key
  /api/v1/payments/proofs:
    post:
      summary: Submit investor payment proof metadata
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment proof submitted
  /api/v1/payments/bank-transactions:
    post:
      summary: Import idempotent bank transaction
      security:
        - bearerAuth: []
      parameters:
        - name: idempotency-key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bank transaction imported
  /api/v1/payments/reconciliations:
    get:
      summary: List reconciliations for a project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reconciliation list
    post:
      summary: Match payment instruction to bank transaction
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Matched or exception reconciliation created
  /api/v1/payments/confirm-cleared:
    post:
      summary: Confirm matched payment as cleared
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commitment moved to reconciled
        "409":
          description: Matched reconciliation required
  /api/v1/payments/exceptions:
    get:
      summary: List payment reconciliation exceptions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment exceptions
  /api/v1/refunds/proposals:
    post:
      summary: Propose refund for controlled approval
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Refund proposed
  /api/v1/refunds/approve:
    post:
      summary: Approve refund with four-eyes control
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Refund approved
        "403":
          description: Independent approval required
  /api/v1/operations/budgets:
    get:
      summary: List project operation budgets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Budget list
    post:
      summary: Create project budget revision
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Budget revision created
  /api/v1/operations/budgets/approve:
    post:
      summary: Approve budget revision with four-eyes control
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Budget approved
  /api/v1/operations/budget-variance:
    get:
      summary: Budget variance by budget code
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Budget variance list
  /api/v1/operations/procurements:
    post:
      summary: Create procurement request against approved budget
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Procurement requested
        "409":
          description: Budget unavailable
  /api/v1/operations/procurements/approve:
    post:
      summary: Approve procurement request with four-eyes control
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Procurement approved
  /api/v1/operations/expenses:
    post:
      summary: Submit expense claim against approved budget or procurement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Expense submitted
        "409":
          description: Budget or procurement control failed
  /api/v1/operations/expenses/approve:
    post:
      summary: Approve expense claim with account-manager control
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Expense approved
  /api/v1/operations/assets:
    post:
      summary: Register asset from approved operational expense
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Asset registered
  /api/v1/operations/milestones:
    post:
      summary: Create milestone plan with deliverables
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Milestone planned
  /api/v1/operations/milestones/evidence:
    post:
      summary: Submit milestone evidence and progress
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Milestone evidence submitted
  /api/v1/operations/milestones/verify:
    post:
      summary: Verify milestone evidence with independent approval
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Milestone verified
  /api/v1/operations/fund-releases:
    post:
      summary: Request fund release for verified milestone
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fund release requested
        "409":
          description: Milestone is not verified
  /api/v1/operations/fund-releases/finance-approve:
    post:
      summary: Finance approval for fund release
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Finance approved
  /api/v1/operations/fund-releases/compliance-approve:
    post:
      summary: Compliance approval for fund release
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Compliance approved
  /api/v1/operations/fund-releases/release:
    post:
      summary: Release funds only after approvals and posted voucher verification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Funds released
        "409":
          description: Approval or posted voucher verification failed
  /api/v1/operations/project-updates:
    post:
      summary: Publish project update for timeline feed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project update published
  /api/v1/operations/timeline:
    get:
      summary: Project milestone, release, and update timeline
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project timeline
  /api/v1/operations/health:
    get:
      summary: Project health score and explanations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project health read model
  /api/v1/operations/milestone-alerts:
    get:
      summary: Delayed milestone alerts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Milestone alert list
  /api/v1/accounting/accounts:
    get:
      summary: Chart of accounts
      responses:
        "200":
          description: Account catalogue
  /api/v1/accounting/periods:
    get:
      summary: Fiscal periods
      responses:
        "200":
          description: Fiscal period catalogue
  /api/v1/accounting/vouchers:
    post:
      summary: Create balanced voucher draft
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Voucher draft created
        "409":
          description: Voucher is unbalanced
  /api/v1/accounting/vouchers/submit:
    post:
      summary: Submit voucher for checking
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Voucher submitted
  /api/v1/accounting/vouchers/check:
    post:
      summary: Check voucher with four-eyes control
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Voucher checked
  /api/v1/accounting/vouchers/authorize:
    post:
      summary: Authorize voucher with amount limit
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Voucher authorized
  /api/v1/accounting/vouchers/post:
    post:
      summary: Post authorized voucher to journal
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Voucher posted
  /api/v1/accounting/vouchers/reverse:
    post:
      summary: Reverse posted voucher with equal and opposite entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reversal posted
  /api/v1/accounting/reports/general-ledger:
    get:
      summary: General ledger report
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Journal entries
  /api/v1/accounting/reports/trial-balance:
    get:
      summary: Trial balance report
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Debit and credit balances by account
  /api/v1/projects:
    get:
      summary: List projects visible to current principal
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scoped project list
  /api/v1/projects/detail:
    get:
      summary: Project detail with sponsor, due diligence, risk, and offers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scoped project detail
  /api/v1/projects/submit-due-diligence:
    post:
      summary: Explicit command to submit a draft project for due diligence
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project moved to due diligence
        "403":
          description: Permission denied
        "409":
          description: Invalid lifecycle transition
  /api/v1/projects/due-diligence/complete-item:
    post:
      summary: Complete a due-diligence checklist item
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Item completed
        "403":
          description: Permission denied
  /api/v1/projects/due-diligence/findings:
    post:
      summary: Record a due-diligence finding
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Finding recorded
        "403":
          description: Permission denied
  /api/v1/projects/risk-assessments:
    post:
      summary: Calculate and record explainable project risk assessment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Risk assessment created
        "400":
          description: Invalid risk score
  /api/v1/projects/submit-review:
    post:
      summary: Submit a due-diligence-ready project for internal review
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project moved to review
        "409":
          description: Due diligence or risk assessment missing
  /api/v1/projects/approve:
    post:
      summary: Approve a project after due diligence and risk assessment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project approved
        "409":
          description: Project is not ready for approval
  /api/v1/projects/publish:
    post:
      summary: Explicit command to publish an approved project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project published
        "403":
          description: Permission denied
        "409":
          description: Invalid lifecycle transition
  /api/v1/projects/offer-versions:
    get:
      summary: List immutable offer versions for a project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Offer version list
  /api/v1/vouchers/authorization-preview:
    post:
      summary: Validate voucher authorization controls without posting
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorization controls pass
        "403":
          description: Permission, approval limit, or four-eyes control failed
  /api/v1/accounting/periods/close-checklist:
    get:
      summary: Read the period close checklist and automated gate status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Close checklist
        "403":
          description: Permission denied
        "404":
          description: Fiscal period not found
  /api/v1/accounting/periods/start-close:
    post:
      summary: Move a fiscal period into the closing state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Period is closing
        "409":
          description: Invalid period transition
  /api/v1/accounting/periods/checklist-items:
    post:
      summary: Complete a manual close checklist item with evidence
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checklist item completed
        "400":
          description: Evidence reference is required
        "409":
          description: Item is automated or close has not started
  /api/v1/accounting/periods/reopen:
    post:
      summary: Reopen a closed period for documented adjustment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Period reopened for adjustment
        "409":
          description: Locked periods cannot be reopened
  /api/v1/accounting/periods/close:
    post:
      summary: Close a period, compute its result, and open the next period
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Period closed with computed result
        "409":
          description: Checklist incomplete or ledger unbalanced
  /api/v1/accounting/periods/lock:
    post:
      summary: Lock a closed period under independent approval
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Period locked
        "403":
          description: Permission or four-eyes control failed
        "409":
          description: Period is not closed
  /api/v1/accounting/reports/profit-and-loss:
    get:
      summary: Profit and loss for a fiscal period
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Period profit and loss
  /api/v1/accounting/reports/loss-carry-forward:
    get:
      summary: Loss carry-forward history for a project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Loss carry-forward position
  /api/v1/investments/allocations:
    post:
      summary: Allocate a reconciled commitment into project holdings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commitment allocated
        "409":
          description: Invalid commitment transition
  /api/v1/investments/activations:
    post:
      summary: Activate an allocated commitment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commitment active
  /api/v1/distributions/formula-versions:
    get:
      summary: List distribution formula versions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Formula version list
    post:
      summary: Draft a distribution formula version
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Formula version drafted
        "400":
          description: Basis, residual policy, or rate is invalid
  /api/v1/distributions/formula-versions/publish:
    post:
      summary: Publish a formula version under independent approval
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Formula version published
        "409":
          description: Formula version is already published
  /api/v1/distributions:
    get:
      summary: List distributions for a project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Distribution list
    post:
      summary: Create a distribution proposal from a locked period
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Distribution proposal created
        "409":
          description: Period is not locked, formula is unpublished, or no distributable profit exists
  /api/v1/distributions/calculate:
    post:
      summary: Calculate investor entitlements for a distribution
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entitlements calculated
        "409":
          description: No eligible holdings
  /api/v1/distributions/review:
    post:
      summary: Independently review a calculated distribution
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Distribution reviewed
        "403":
          description: Four-eyes control failed
  /api/v1/distributions/approve:
    post:
      summary: Approve a reviewed distribution within approval limits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Distribution approved
        "403":
          description: Four-eyes or approval limit control failed
        "409":
          description: Distribution has not been reviewed
  /api/v1/distributions/post-payable:
    post:
      summary: Record the posted accounting voucher backing the distribution payable
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Distribution payable posted
        "409":
          description: Voucher amount does not match the approved distribution
  /api/v1/distributions/payment-batches:
    post:
      summary: Create a payout batch for payable entitlements
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Payment batch created
        "409":
          description: No payable entitlements are available
  /api/v1/distributions/payment-results:
    post:
      summary: Record paid, failed, and returned payout results
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment results recorded
        "400":
          description: Outcome or failure reason is invalid
  /api/v1/distributions/entitlements/reissue:
    post:
      summary: Reissue a failed or returned entitlement payment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entitlement resubmitted for payment
  /api/v1/distributions/entitlements/hold:
    post:
      summary: Place a compliance hold on an entitlement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entitlement held
  /api/v1/distributions/entitlements/release-hold:
    post:
      summary: Release an entitlement hold once conditions are cleared
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entitlement hold released
        "409":
          description: Hold condition is still active
  /api/v1/distributions/entitlements/cancel:
    post:
      summary: Cancel a held entitlement with a documented reason
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entitlement cancelled
  /api/v1/distributions/reconcile:
    post:
      summary: Reconcile a distribution once all payments settle
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Distribution reconciled
        "409":
          description: Payments are still outstanding
  /api/v1/distributions/complete:
    post:
      summary: Complete a reconciled distribution
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Distribution completed
        "409":
          description: Entitlements remain unresolved
  /api/v1/distributions/statements/me:
    get:
      summary: Current investor distribution statement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Investor statement
  /api/v1/projects/settlement/close:
    post:
      summary: Record final project settlement after all distributions complete
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project settled
        "409":
          description: Distributions are not completed
  /api/v1/projects/settlement/archive:
    post:
      summary: Archive a settled project under independent approval
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project settlement archived
        "403":
          description: Four-eyes control failed
  /api/v1/payments/project-accounts:
    get:
      summary: List escrow, segregated, and operating project accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project account list with masked fingerprints
